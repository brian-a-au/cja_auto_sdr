# Keeps GitHub Actions pins current. Every action in .github/workflows is
# pinned by commit SHA with the version in a trailing comment, e.g.
# `@<sha> # v7`, because a tag can be moved and a commit cannot. Dependabot
# updates the SHA and the comment together. tests/test_release_workflow.py
# fails when a workflow uses an action that is not pinned by commit.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Wait for a release to age before proposing it: hijacked or broken
    # releases are usually yanked within days, and the review script already
    # rejects yanked artifacts. Security updates are not delayed.
    cooldown:
      default-days: 3
    # Each update PR runs the full CI matrix, so batch them. The dev-tools
    # group holds only the patch bumps that dependabot-auto-merge may merge
    # (scripts/dependabot_review.py ALLOWED_PACKAGES); mixing in any other
    # package would force the whole PR to manual review. Major bumps stay
    # as single PRs so each breaking change is reviewed on its own.
    groups:
      dev-tools-patch:
        patterns: ["ruff", "pytest", "pytest-cov", "pytest-xdist"]
        update-types: ["patch"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
