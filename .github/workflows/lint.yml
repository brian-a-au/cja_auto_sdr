name: lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
      - name: Sync dependencies
        run: uv sync --locked --dev
      - name: Ruff check
        run: uv run --locked ruff check src/ tests/ scripts/ examples/
      - name: Ruff format check
        run: uv run --locked ruff format --check src/ tests/ scripts/ examples/

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # shellcheck ships on the ubuntu-latest image; no apt install needed.
      - name: Lint shell scripts
        run: |
          shellcheck --version
          shellcheck examples/automation/*.sh examples/agent-workflows/*.sh

  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
      - name: Verify lockfile is in sync
        run: uv lock --check
