name: update-badges

# Refresh the README's coverage % and test-count badges when they drift
# from the latest `Tests` workflow run on main. Opens (or updates) a PR
# titled `chore: refresh README badges` when values change. Manual edits
# to the badges are not needed — let CI keep them honest.
#
# Branch protection on `main` rejects direct pushes from CI, so this
# workflow opens a PR via peter-evans/create-pull-request and the standard
# required-checks gate runs against the PR before a human merges it. If
# the values match main already (the common case after a normal merge),
# no PR is opened.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    # Only refresh badges after a successful Tests run; on workflow_dispatch
    # there's no upstream conclusion so allow it through unconditionally.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --dev --extra clustering

      - name: Re-derive coverage + test count
        id: stats
        shell: bash
        run: |
          set -euo pipefail
          # Mirror the `test-unit` job in tests.yml — same selector, same
          # 95% gate. If coverage drops below the gate, this step fails
          # and no badge-update PR is opened (consistent with the Tests
          # workflow's contract).
          uv run pytest tests/ --tb=short \
            -m "unit and not slow" -n auto \
            --cov=cja_auto_sdr --cov-report=term --cov-fail-under=95 \
            | tee /tmp/test-unit.log
          # Coverage line looks like: `TOTAL  ...  99%`
          COVERAGE="$(grep -E '^TOTAL' /tmp/test-unit.log | awk '{print $NF}' | tr -d '%')"
          # Test count: the README badge counts ALL tests, not just the
          # unit slice. pytest's `-q` + pytest-cov suppresses the
          # "N passed in X.XXs" summary in non-tty output, so use a
          # separate `--collect-only --no-cov` pass — its summary line
          # `7895 tests collected in 0.74s` appears regardless of -q.
          TESTS="$(uv run pytest --collect-only --no-cov 2>&1 | grep -oE '[0-9]+ tests collected' | head -1 | awk '{print $1}')"
          if [ -z "$COVERAGE" ] || [ -z "$TESTS" ]; then
            echo "Failed to parse coverage (got '$COVERAGE') or test count (got '$TESTS')"
            exit 1
          fi
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          echo "Parsed: coverage=$COVERAGE%, tests=$TESTS"

      - name: Update README badges in place
        env:
          COV: ${{ steps.stats.outputs.coverage }}
          TESTS: ${{ steps.stats.outputs.tests }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          cov = os.environ["COV"]
          tests = os.environ["TESTS"]
          path = pathlib.Path("README.md")
          src = path.read_text()

          # The shields.io URL pattern (`img.shields.io/badge/coverage-`,
          # `/badge/tests-`) is unique to the static-text badges; the GHA
          # tests-status badge uses `actions/workflows/tests.yml/badge.svg`
          # and is unaffected.
          src = re.sub(
              r"https://img\.shields\.io/badge/coverage-\d+%25-brightgreen\.svg",
              f"https://img.shields.io/badge/coverage-{cov}%25-brightgreen.svg",
              src,
          )
          src = re.sub(
              r"https://img\.shields\.io/badge/tests-\d+-brightgreen\.svg",
              f"https://img.shields.io/badge/tests-{tests}-brightgreen.svg",
              src,
          )
          path.write_text(src)
          PY

      - name: Open PR if badges changed
        uses: peter-evans/create-pull-request@v8
        with:
          # Default GITHUB_TOKEN works because the repo grants
          # `pull-requests: write` at the workflow level above.
          commit-message: "chore: refresh README badges (coverage / test count)"
          title: "chore: refresh README badges"
          body: |
            Auto-generated by `update-badges` workflow.

            Latest values from the `Tests` workflow on `main`:

            | Badge | Old (main) | New |
            |---|---|---|
            | Coverage | (see diff) | **${{ steps.stats.outputs.coverage }}%** |
            | Tests collected | (see diff) | **${{ steps.stats.outputs.tests }}** |

            If the diff is empty, this PR isn't opened — main already matches.
          branch: bot/update-badges
          delete-branch: true
          base: main
          add-paths: README.md
