name: update-badges

# Refresh the README's coverage % and test-count badges when they drift
# from the latest `tests` workflow run on main. Opens (or updates) a PR
# titled `chore: refresh README badges` when values change. Manual edits
# to the badges are not needed — let CI keep them honest.
#
# Branch protection on `main` rejects direct pushes from CI, so this
# workflow opens a PR via peter-evans/create-pull-request and the standard
# required-checks gate runs against the PR before a human merges it. If
# the values match main already (the common case after a normal merge),
# no PR is opened.

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  update:
    # Only refresh badges after a successful tests push run on main (only
    # those upload metrics); on workflow_dispatch there's no upstream run,
    # so allow it through and read the latest successful push run instead.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Pick the tests run to read metrics from
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$TRIGGER_RUN_ID"
          if [ -z "$run_id" ]; then
            # workflow_dispatch: use the latest successful tests push on main.
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml --branch main \
              --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      # test-unit (3.14) on main uploads the coverage % and test count it
      # parsed, so this job reads them instead of re-running the suite. A
      # missing artifact (metrics parse failed upstream) fails this step and
      # no badge PR is opened.
      - name: Download badge metrics from the tests run
        uses: actions/download-artifact@v8.0.2
        with:
          name: test-metrics
          path: /tmp/test-metrics
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Read coverage + test count
        id: stats
        shell: bash
        run: |
          set -euo pipefail
          COVERAGE="$(jq -r .coverage /tmp/test-metrics/test-metrics.json)"
          TESTS="$(jq -r .tests /tmp/test-metrics/test-metrics.json)"
          # Artifact values land in README.md; accept plain numbers only.
          if ! [[ "$COVERAGE" =~ ^[0-9]+$ && "$TESTS" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected metrics (coverage='$COVERAGE', tests='$TESTS')"
            exit 1
          fi
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          echo "Parsed: coverage=$COVERAGE%, tests=$TESTS"

      - name: Update README badges in place
        env:
          COV: ${{ steps.stats.outputs.coverage }}
          TESTS: ${{ steps.stats.outputs.tests }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          cov = os.environ["COV"]
          tests = os.environ["TESTS"]
          path = pathlib.Path("README.md")
          src = path.read_text()

          # The shields.io URL pattern (`img.shields.io/badge/coverage-`,
          # `/badge/tests-`) is unique to the static-text badges; the GHA
          # tests-status badge uses `actions/workflows/tests.yml/badge.svg`
          # and is unaffected.
          src = re.sub(
              r"https://img\.shields\.io/badge/coverage-\d+%25-brightgreen\.svg",
              f"https://img.shields.io/badge/coverage-{cov}%25-brightgreen.svg",
              src,
          )
          src = re.sub(
              r"https://img\.shields\.io/badge/tests-\d+-brightgreen\.svg",
              f"https://img.shields.io/badge/tests-{tests}-brightgreen.svg",
              src,
          )
          path.write_text(src)
          PY

      - name: Open PR if badges changed
        uses: peter-evans/create-pull-request@v8
        with:
          # Default GITHUB_TOKEN works because the repo grants
          # `pull-requests: write` at the workflow level above.
          commit-message: "chore: refresh README badges (coverage / test count)"
          title: "chore: refresh README badges"
          body: |
            Auto-generated by `update-badges` workflow.

            Latest values from the `tests` workflow on `main`:

            | Badge | Old (main) | New |
            |---|---|---|
            | Coverage | (see diff) | **${{ steps.stats.outputs.coverage }}%** |
            | Tests collected | (see diff) | **${{ steps.stats.outputs.tests }}** |

            If the diff is empty, this PR isn't opened — main already matches.
          branch: bot/update-badges
          delete-branch: true
          base: main
          add-paths: README.md
