name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate-change-detect:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_gate_related: ${{ steps.filter.outputs.release_gate_related }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            release_gate_related:
              - "README.md"
              - "pyproject.toml"
              - "scripts/check_pypi_readme_links.py"
              - "scripts/check_version_sync.py"
              - "tests/test_check_pypi_readme_links.py"
              - ".github/workflows/patch-release-gate.yml"
              - ".github/workflows/release.yml"
              - ".github/workflows/tests.yml"

  release-gate-focused-tests:
    if: github.event_name == 'pull_request' && needs.release-gate-change-detect.outputs.release_gate_related == 'true'
    needs: release-gate-change-detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
      - name: Sync dependencies
        run: uv sync --locked --dev
      - name: Run focused release-gate contract tests
        run: >
          uv run --locked pytest -q
          tests/test_check_version_sync.py
          tests/test_check_pypi_readme_links.py
          tests/test_cli_color_policy_e2e.py

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
      - name: Sync dependencies
        run: uv sync --locked --dev --extra clustering
      - name: Run unit tests (95% coverage gate applies on Python 3.14)
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -o pipefail
          # Coverage is measured once, on 3.14. Keep the whole-package
          # --cov=cja_auto_sdr form; dotted module paths break numpy imports.
          cov_args=()
          if [ "$PYTHON_VERSION" = "3.14" ]; then
            cov_args=(--cov=cja_auto_sdr --cov-report=term --cov-fail-under=95)
          fi
          # -q overrides pytest.ini's -v: per-test lines from 9K+ tests bloat
          # the log without helping triage (failures still print in full).
          uv run --locked pytest tests/ -q --tb=short \
            -m "unit and not slow" -n auto \
            "${cov_args[@]}" \
            --durations=25 | tee /tmp/test-unit.log
          {
            echo "### test-unit slowest tests"
            echo '```text'
            sed -n '/= slowest 25 durations =/,$p' /tmp/test-unit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Emit coverage + test count to step summary
        # Surface the same metrics the `update-badges` workflow consumes,
        # but on EVERY tests run (PRs and main alike), so reviewers see
        # the current values in the PR's Checks tab without scraping logs.
        # `success()` keeps the output honest — no metrics emitted on a
        # failed run.
        if: ${{ success() && matrix.python-version == '3.14' }}
        shell: bash
        run: |
          # Coverage % from the `TOTAL` row of pytest-cov's term report
          # (already in /tmp/test-unit.log from the previous step).
          COV=$(grep -E '^TOTAL' /tmp/test-unit.log | awk '{print $NF}' | tr -d '%')
          # Test count: pytest's `-q` + pytest-cov suppresses the "N passed
          # in X.XXs" summary in non-tty output, so we count via a separate
          # `--collect-only --no-cov` pass (no test execution; <1s wall time).
          # The summary line `N tests collected in X.XXs` only appears with
          # --collect-only.
          TESTS=$(uv run --locked pytest --collect-only --no-cov 2>&1 | grep -oE '[0-9]+ tests collected' | head -1 | awk '{print $1}')
          if [ -z "$COV" ] || [ -z "$TESTS" ]; then
            echo "::warning::Could not parse coverage (got '$COV') or test count (got '$TESTS') — emitting placeholder summary"
            {
              echo "## Test metrics"
              echo ""
              echo "_Could not parse metrics from pytest output. See run logs._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Test metrics"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Coverage | **${COV}%** |"
            echo "| Tests collected | **${TESTS}** |"
            echo ""
            echo "_Source: \`update-badges\` workflow consumes the same parse from this run on \`main\` to refresh the README badges. PR drift from main is informational here, not gated._"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '{"coverage": "%s", "tests": "%s"}\n' "$COV" "$TESTS" > /tmp/test-metrics.json
      - name: Upload badge metrics for update-badges
        # update-badges reads these instead of re-running the coverage suite.
        if: ${{ success() && matrix.python-version == '3.14' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-metrics
          path: /tmp/test-metrics.json
          # A metrics parse failure only warns above; skip the badge refresh too.
          if-no-files-found: warn
          retention-days: 7

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
      - name: Sync dependencies
        run: uv sync --locked --dev --extra clustering
      - name: Run integration, end-to-end, slow, and smoke test slices
        shell: bash
        run: |
          set -o pipefail
          # Linux smoke tests run here; smoke-test covers macOS and Windows.
          uv run --locked pytest tests/ -q --tb=short -m "integration or e2e or slow or smoke" --durations=25 | tee /tmp/test-integration.log
          {
            echo "### test-integration slowest tests"
            echo '```text'
            sed -n '/= slowest 25 durations =/,$p' /tmp/test-integration.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-test:
    # Linux smoke tests run in test-integration. macOS runners queue longest,
    # so PRs check the newest Python only; main pushes add the 3.11 floor.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.14"]' || '["3.11", "3.14"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
      - name: Sync dependencies
        run: uv sync --locked --dev
      - name: Smoke test - version, help, exit-codes
        run: |
          uv run --locked python -m cja_auto_sdr --version
          uv run --locked python -m cja_auto_sdr --exit-codes
          uv run --locked python -m cja_auto_sdr --help
      - name: Smoke test - parser and contract tests
        run: uv run --locked pytest tests/ -q --tb=short -m smoke

  build:
    # One wheel, three install checks: a plain uv install, a no-extras install
    # (the optional `notion-client` extra must stay optional; the `dev` group
    # includes it for tests), and a plain-pip install on the Python 3.11 floor
    # the way a user without uv would, resolving numpy/pandas from PyPI rather
    # than uv.lock. Folded into one job to save runner slots.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
      - name: Clean build artifacts
        run: rm -f dist/*.whl dist/*.tar.gz
      - name: Build package
        run: uv build
      - name: Locate the wheel
        id: wheel
        shell: bash
        run: |
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          echo "path=${wheels[0]}" >> "$GITHUB_OUTPUT"
      - name: Install wheel into isolated venv (no extras, no dev deps)
        env:
          WHEEL: ${{ steps.wheel.outputs.path }}
        run: |
          uv venv /tmp/no-extras-venv --python 3.14
          uv pip install "$WHEEL" --python /tmp/no-extras-venv/bin/python
      - name: Confirm notion_client is NOT installed in this environment
        run: |
          if /tmp/no-extras-venv/bin/python -c "import notion_client" 2>/dev/null; then
            echo "::error::notion_client was installed without the [notion] extra — optional-dep contract is broken" >&2
            exit 1
          fi
      - name: Package imports cleanly without notion_client
        run: |
          /tmp/no-extras-venv/bin/python -c "from cja_auto_sdr.core.version import __version__; print(f'v{__version__}')"
          /tmp/no-extras-venv/bin/python -m cja_auto_sdr --version
          /tmp/no-extras-venv/bin/python -m cja_auto_sdr --exit-codes > /dev/null
          /tmp/no-extras-venv/bin/python -c "import cja_auto_sdr; import cja_auto_sdr.output.writers.notion as _n; print('module loads:', _n.__name__)"
      - name: Install wheel with pip into a stdlib venv on Python 3.11
        shell: bash
        env:
          WHEEL: ${{ steps.wheel.outputs.path }}
        run: |
          uv python install 3.11
          python3_11="$(uv python find 3.11)"
          "$python3_11" -m venv /tmp/pip-venv
          /tmp/pip-venv/bin/python -m pip install --upgrade pip
          /tmp/pip-venv/bin/python -m pip install "$WHEEL"
      - name: CLI starts on Python 3.11
        shell: bash
        run: |
          /tmp/pip-venv/bin/python --version
          /tmp/pip-venv/bin/cja_auto_sdr --version
          help_output="$(/tmp/pip-venv/bin/python -m cja_auto_sdr --help)"
          head -5 <<<"$help_output"
          if ! grep -q -- "-m cja_auto_sdr" <<<"$help_output"; then
            echo "::error::'python -m cja_auto_sdr --help' did not report the module program name" >&2
            exit 1
          fi
          # --help goes through the fast path; a usage error reaches the full parser.
          set +e
          /tmp/pip-venv/bin/python -m cja_auto_sdr --bogus-flag >/dev/null 2>/tmp/usage-error.txt
          usage_status=$?
          set -e
          tail -1 /tmp/usage-error.txt
          if [ "$usage_status" -ne 2 ] || ! grep -q -- "-m cja_auto_sdr: error:" /tmp/usage-error.txt; then
            echo "::error::Full parser usage error did not exit 2 with the module program name" >&2
            exit 1
          fi
          /tmp/pip-venv/bin/python -c "import numpy, pandas; print('numpy', numpy.__version__, 'pandas', pandas.__version__)"

  ci-gate:
    if: always()
    needs: [test-unit, test-integration, smoke-test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs passed
        # Design note: the check below treats any non-"success" result
        # (including "skipped") as a failure. This is intentional — all four
        # required jobs are unconditional. If a job is ever made conditional
        # (with an `if:` guard), its "skipped" result will fail this gate;
        # update the check accordingly if that happens.
        run: |
          declare -A results=(
            [test-unit]="${{ needs.test-unit.result }}"
            [test-integration]="${{ needs.test-integration.result }}"
            [smoke-test]="${{ needs.smoke-test.result }}"
            [build]="${{ needs.build.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            r="${results[$job]}"
            if [[ "$r" != "success" ]]; then
              echo "FAIL: $job = $r"
              failed=1
            else
              echo "OK:   $job = $r"
            fi
          done
          if [[ "$failed" -eq 1 ]]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
          echo "All required jobs passed."
