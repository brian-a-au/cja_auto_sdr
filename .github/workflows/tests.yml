name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-gate-change-detect:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_gate_related: ${{ steps.filter.outputs.release_gate_related }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            release_gate_related:
              - "scripts/check_version_sync.py"
              - ".github/workflows/patch-release-gate.yml"
              - ".github/workflows/tests.yml"

  release-gate-focused-tests:
    if: github.event_name == 'pull_request' && needs.release-gate-change-detect.outputs.release_gate_related == 'true'
    needs: release-gate-change-detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
      - name: Sync dependencies
        run: uv sync --dev
      - name: Run focused release-gate contract tests
        run: uv run pytest -q tests/test_check_version_sync.py tests/test_cli_color_policy_e2e.py

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
      - name: Sync dependencies
        run: uv sync --dev --extra clustering
      - name: Run unit tests with coverage (95% gate applies to this slice)
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/ -v --tb=short \
            -m "unit and not slow" -n auto \
            --cov=cja_auto_sdr --cov-report=term --cov-fail-under=95 \
            --durations=25 | tee /tmp/test-unit.log
          {
            echo "### test-unit slowest tests"
            echo '```text'
            sed -n '/= slowest 25 durations =/,$p' /tmp/test-unit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Emit coverage + test count to step summary
        # Surface the same metrics the `update-badges` workflow consumes,
        # but on EVERY tests run (PRs and main alike), so reviewers see
        # the current values in the PR's Checks tab without scraping logs.
        # `success()` keeps the output honest — no metrics emitted on a
        # failed run.
        if: ${{ success() }}
        shell: bash
        run: |
          # Coverage % from the `TOTAL` row of pytest-cov's term report
          # (already in /tmp/test-unit.log from the previous step).
          COV=$(grep -E '^TOTAL' /tmp/test-unit.log | awk '{print $NF}' | tr -d '%')
          # Test count: pytest's `-q` + pytest-cov suppresses the "N passed
          # in X.XXs" summary in non-tty output, so we count via a separate
          # `--collect-only --no-cov` pass (no test execution; <1s wall time).
          # The summary line `N tests collected in X.XXs` only appears with
          # --collect-only.
          TESTS=$(uv run pytest --collect-only --no-cov 2>&1 | grep -oE '[0-9]+ tests collected' | head -1 | awk '{print $1}')
          if [ -z "$COV" ] || [ -z "$TESTS" ]; then
            echo "::warning::Could not parse coverage (got '$COV') or test count (got '$TESTS') — emitting placeholder summary"
            {
              echo "## Test metrics"
              echo ""
              echo "_Could not parse metrics from pytest output. See run logs._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Test metrics"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Coverage | **${COV}%** |"
            echo "| Tests collected | **${TESTS}** |"
            echo ""
            echo "_Source: \`update-badges\` workflow consumes the same parse from this run on \`main\` to refresh the README badges. PR drift from main is informational here, not gated._"
          } >> "$GITHUB_STEP_SUMMARY"

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
      - name: Sync dependencies
        run: uv sync --dev --extra clustering
      - name: Run integration, end-to-end, and slow test slices
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/ -q --tb=short -m "integration or e2e or slow" --durations=25 | tee /tmp/test-integration.log
          {
            echo "### test-integration slowest tests"
            echo '```text'
            sed -n '/= slowest 25 durations =/,$p' /tmp/test-integration.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  run-summary-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
      - name: Sync dependencies
        run: uv sync --dev
      - name: Run run-summary JSON contract tests
        run: >
          uv run pytest -q tests/test_quality_policy_and_run_summary.py
          -m run_summary_contract

  smoke-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
      - name: Sync dependencies
        run: uv sync --dev
      - name: Smoke test - version, help, exit-codes
        run: |
          uv run python -m cja_auto_sdr --version
          uv run python -m cja_auto_sdr --exit-codes
          uv run python -m cja_auto_sdr --help
      - name: Smoke test - parser and contract tests
        run: uv run pytest tests/ -q --tb=short -m smoke

  no-extras-smoke:
    # Confirm the package imports and runs without the optional `notion-client`
    # extra installed. The `dev` group includes notion-client for tests, so we
    # build the wheel and install it into a fresh, isolated venv without any
    # extras — the same shape users get from `pip install cja-auto-sdr`.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
      - name: Build wheel
        run: |
          rm -f dist/*.whl dist/*.tar.gz
          uv build --wheel
      - name: Install wheel into isolated venv (no extras, no dev deps)
        run: |
          uv venv /tmp/no-extras-venv --python 3.14
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          uv pip install "${wheels[0]}" --python /tmp/no-extras-venv/bin/python
      - name: Confirm notion_client is NOT installed in this environment
        run: |
          if /tmp/no-extras-venv/bin/python -c "import notion_client" 2>/dev/null; then
            echo "::error::notion_client was installed without the [notion] extra — optional-dep contract is broken" >&2
            exit 1
          fi
      - name: Package imports cleanly without notion_client
        run: |
          /tmp/no-extras-venv/bin/python -m cja_auto_sdr --version
          /tmp/no-extras-venv/bin/python -c "import cja_auto_sdr; import cja_auto_sdr.output.writers.notion as _n; print('module loads:', _n.__name__)"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false
      - name: Clean build artifacts
        run: rm -f dist/*.whl dist/*.tar.gz
      - name: Build package
        run: uv build
      - name: Verify wheel installs
        shell: bash
        run: |
          uv venv /tmp/test-install
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel artifact, found ${#wheels[@]}" >&2
            exit 1
          fi
          uv pip install "${wheels[0]}" --python /tmp/test-install/bin/python
          /tmp/test-install/bin/python -c "from cja_auto_sdr.core.version import __version__; print(f'v{__version__}')"

  ci-gate:
    if: always()
    needs: [test-unit, test-integration, run-summary-contract, smoke-test, no-extras-smoke, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs passed
        # Design note: the check below treats any non-"success" result
        # (including "skipped") as a failure. This is intentional — all five
        # required jobs are unconditional. If a job is ever made conditional
        # (with an `if:` guard), its "skipped" result will fail this gate;
        # update the check accordingly if that happens.
        run: |
          declare -A results=(
            [test-unit]="${{ needs.test-unit.result }}"
            [test-integration]="${{ needs.test-integration.result }}"
            [run-summary-contract]="${{ needs.run-summary-contract.result }}"
            [smoke-test]="${{ needs.smoke-test.result }}"
            [no-extras-smoke]="${{ needs.no-extras-smoke.result }}"
            [build]="${{ needs.build.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            r="${results[$job]}"
            if [[ "$r" != "success" ]]; then
              echo "FAIL: $job = $r"
              failed=1
            else
              echo "OK:   $job = $r"
            fi
          done
          if [[ "$failed" -eq 1 ]]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
          echo "All required jobs passed."
